<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAS RACING - Motomecánica</title>
    <!-- Mantenemos tus estilos originales intactos -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rojo-racing: #E52421;
            --negro-fondo: #0A0B0D;
            --gris-card: #1A1D22;
            --gris-input: #0F1114;
            --gris-borde: #2A2E35;

            --texto-gris: #9EA3AE;
            --verde-exito: #28a745;
        }
        /* ... (tus estilos existentes permanecen iguales) ... */
        .btn-outline.selected { background-color: var(--rojo-racing); color: white; border: 1px solid white; }
    </style>
</head>
<body>

<!-- ... (Header y Hero igual) ... -->

<!-- SECCIÓN SERVICIOS -->
<section class="main-section" id="servicios">
    <h2 class="section-title">SERVICIOS DISPONIBLES</h2>
    <div class="services-grid">
        <div class="service-card">
            <i class="fa-solid fa-wrench"></i>
            <h4>SERVICE</h4>
            <button class="btn-outline" onclick="seleccionarServicio(this, 'Service Completo')">SELECCIONAR</button>
        </div>
        <div class="service-card">
            <i class="fa-solid fa-circle-dot"></i>
            <h4>FRENOS</h4>
            <button class="btn-outline" onclick="seleccionarServicio(this, 'Frenos')">SELECCIONAR</button>
        </div>
        <div class="service-card">
            <i class="fa-solid fa-link"></i>
            <h4>TRANSMISIÓN</h4>
            <button class="btn-outline" onclick="seleccionarServicio(this, 'Transmisión')">SELECCIONAR</button>
        </div>
        <div class="service-card">
            <i class="fa-solid fa-arrows-up-down"></i>
            <h4>AMORTIGUACIÓN</h4>
            <button class="btn-outline" onclick="seleccionarServicio(this, 'Amortiguación')">SELECCIONAR</button>
        </div>
        <div class="service-card">
            <i class="fa-solid fa-clipboard-check"></i>
            <h4>DIAGNÓSTICO</h4>
            <button class="btn-outline" onclick="seleccionarServicio(this, 'Diagnóstico')">SELECCIONAR</button>
        </div>
    </div>
</section>

<!-- ... (resto del HTML igual) ... -->

<script>
    const NUMERO_WHATSAPP = "5493425688013";
    const HORARIOS_DISPONIBLES = ["09:00 HS", "11:00 HS", "15:00 HS", "17:00 HS"];
    
    // INICIALIZACIÓN
    let servicioSeleccionado = "Service Completo"; // Valor por defecto
    let clientesBD = JSON.parse(localStorage.getItem('masracing_clientes')) || {};
    let turnosBD = JSON.parse(localStorage.getItem('masracing_turnos')) || [];

    // SELECCIÓN DE SERVICIO
    function seleccionarServicio(btn, nombreServicio) {
        // Quitar clase selected a todos
        document.querySelectorAll('.btn-outline').forEach(b => b.classList.remove('selected'));
        // Agregar al clicado
        btn.classList.add('selected');
        servicioSeleccionado = nombreServicio;
        // Scroll suave al formulario de turnos
        document.getElementById('turnos').scrollIntoView({behavior: 'smooth'});
        alert("Servicio seleccionado: " + nombreServicio);
    }

    // RESERVAR Y REGISTRAR
    function reservarYEnviarWhatsApp() {
        const dni = document.getElementById('turnoDni').value.trim();
        const fecha = document.getElementById('turnoFecha').value;
        const hora = document.getElementById('turnoHora').value;
        const marca = document.getElementById('motoMarca').value;
        const modelo = document.getElementById('motoModelo').value;
        const repuestos = document.getElementById('repuestosModo').value;

        if (!clientesBD[dni]) {
            alert("Error: El DNI no está registrado. Por favor, registrate primero en la pestaña 1.");
            return;
        }

        // GUARDAR TURNO
        const nuevoTurno = {
            id: Date.now(),
            dni: dni,
            servicio: servicioSeleccionado,
            fecha: fecha,
            hora: hora,
            marca: marca,
            modelo: modelo,
            estado: "AGENDADO"
        };

        turnosBD.push(nuevoTurno);
        
        // ACTUALIZAR HISTORIAL DEL CLIENTE
        clientesBD[dni].trabajosRealizados = (clientesBD[dni].trabajosRealizados || 0) + 1;

        // GUARDAR EN LOCALSTORAGE
        localStorage.setItem('masracing_turnos', JSON.stringify(turnosBD));
        localStorage.setItem('masracing_clientes', JSON.stringify(clientesBD));

        // MENSAJE WHATSAPP
        const mensaje = `Hola MAS RACING! Quiero solicitar un turno:%0A%0A` +
                        `👤 Cliente: ${clientesBD[dni].nombre}%0A` +
                        `🛠️ Servicio: ${servicioSeleccionado}%0A` +
                        `🏍️ Moto: ${marca} ${modelo}%0A` +
                        `📅 Fecha: ${fecha} a las ${hora}%0A` +
                        `📦 Repuestos: ${repuestos}`;

        window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=${mensaje}`, '_blank');
        
        // Actualizar vista de perfil inmediatamente
        verificarDniAuto();
        alert("¡Turno registrado en tu historial!");
    }
    
    // (Mantener el resto de tus funciones: switchTab, verificarDniAuto, etc.)
</script>

</body>
</html>
