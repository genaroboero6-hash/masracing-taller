<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponsor Logos</title>
  <style>
    body {
      background-color: #0f0f11;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    .brand-container {
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 20px;
    }

    .brand-card {
      background: #1a1a1e;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .brand-card:hover {
      transform: translateY(-5px);
    }

    .brand-card.monster:hover {
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
      border-color: #00ff00;
    }

    .brand-card.redbull:hover {
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
      border-color: #ff0000;
    }

    .brand-logo {
      height: 100px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body>

  <div class="brand-container">
    <div class="brand-card monster">
      <img src="./monster.png" alt="Monster Energy" class="brand-logo">
    </div>

    <div class="brand-card redbull">
      <img src="./redbull.png" alt="Red Bull" class="brand-logo">
    </div>
  </div>

</body>
</html>
